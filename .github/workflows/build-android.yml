name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Generate and Persist Signing Keystore
      run: |
        cd android
        if [ ! -f "app/arn_technology_release.jks" ]; then
          keytool -genkeypair -v -keystore app/arn_technology_release.jks -alias arn_technology -keyalg RSA -keysize 2048 -validity 10000 -storepass arn_stream_2026 -keypass arn_stream_2026 -dname "CN=ARN Technology, OU=Mobile, O=ARN Technology, L=Cairo, ST=Cairo, C=EG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/arn_technology_release.jks
          git commit -m "chore: persist signing keystore for consistent APK signature" || true
          git push || true
        fi

    - name: Build Android APK (Release and Debug)
      run: |
        cd android
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 9.3.1
        fi
        chmod +x gradlew
        ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
        cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ARN-Stream-Release.apk
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/ARN-Stream-Debug.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ARN-Stream-App
        path: |
          android/app/build/outputs/apk/release/ARN-Stream-Release.apk
          android/app/build/outputs/apk/release/ARN-Stream-Debug.apk

    - name: Publish Direct APK Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.0.1
        name: "ARN Stream v1.0.1 - Android APK"
        body: "تطبيق ARN Stream للأندرويد (تحديث التوافق الشامل v1.0.1).\n\n⭐ النسخة الرسمية: ARN-Stream-Release.apk\n🛠️ النسخة التجريبية: ARN-Stream-Debug.apk\n\n📌 ملاحظات التثبيت الهامة:\n1. إذا كانت لديك أي نسخة تجريبية سابقة مثبتة، يرجى حذفها أولاً من الهاتف.\n2. عند ظهور شاشة حماية Play Protect، اضغط على 'مزيد من التفاصيل' ثم 'التثبيت على أي حال'."
        files: |
          android/app/build/outputs/apk/release/ARN-Stream-Release.apk
          android/app/build/outputs/apk/release/ARN-Stream-Debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
