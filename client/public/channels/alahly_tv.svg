<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="ahlyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d0509"/>
      <stop offset="45%" stop-color="#4d0910"/>
      <stop offset="80%" stop-color="#180204"/>
      <stop offset="100%" stop-color="#0a0102"/>
    </linearGradient>
    <radialGradient id="ahlyGlow" cx="50%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldAhly" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="300" height="420" rx="20" fill="url(#ahlyBg)"/>
  <rect width="300" height="420" rx="20" fill="url(#ahlyGlow)"/>

  <!-- Golden Stars & Laurel Wreath Accents -->
  <g transform="translate(150, 85)" fill="#fbbf24" opacity="0.85" text-anchor="middle">
    <!-- 4 Stars for 40+ League Titles -->
    <path d="M -36 -10 L -33 -3 L -26 -3 L -31 1 L -29 8 L -36 4 L -43 8 L -41 1 L -46 -3 L -39 -3 Z"/>
    <path d="M -12 -12 L -9 -5 L -2 -5 L -7 -1 L -5 6 L -12 2 L -19 6 L -17 -1 L -22 -5 L -15 -5 Z"/>
    <path d="M 12 -12 L 15 -5 L 22 -5 L 17 -1 L 19 6 L 12 2 L 5 6 L 7 -1 L 2 -5 L 9 -5 Z"/>
    <path d="M 36 -10 L 39 -3 L 46 -3 L 41 1 L 43 8 L 36 4 L 29 8 L 31 1 L 26 -3 L 33 -3 Z"/>
  </g>

  <!-- Circular Stadium Rings -->
  <circle cx="150" cy="205" r="130" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.16" stroke-dasharray="6 6"/>
  <circle cx="150" cy="205" r="95" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Top Badges -->
  <g transform="translate(18, 22)">
    <rect width="68" height="24" rx="12" fill="#ef4444" filter="url(#shadow)"/>
    <circle cx="14" cy="12" r="4" fill="#ffffff"/>
    <text x="36" y="16" fill="#ffffff" font-family="'Cairo', 'Inter', sans-serif" font-weight="900" font-size="11" letter-spacing="1">LIVE</text>
  </g>

  <g transform="translate(216, 22)">
    <rect width="66" height="24" rx="6" fill="#000000" fill-opacity="0.65" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1"/>
    <text x="33" y="16" fill="#fbbf24" font-family="'Inter', sans-serif" font-weight="900" font-size="11" text-anchor="middle">FHD 1080</text>
  </g>

  <!-- Center Al Ahly TV Branding Card -->
  <g transform="translate(150, 205)" filter="url(#shadow)" text-anchor="middle">
    <!-- Outer Glass Frame -->
    <rect x="-115" y="-76" width="230" height="152" rx="20" fill="#120204" fill-opacity="0.88" stroke="#dc2626" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Eagle Wings Silhouette Motif -->
    <path d="M -60 -46 Q -20 -60 0 -42 Q 20 -60 60 -46 Q 30 -32 0 -36 Q -30 -32 -60 -46 Z" fill="#fbbf24" opacity="0.6"/>

    <!-- AL AHLY Typography -->
    <text x="0" y="-8" fill="url(#goldAhly)" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="34" letter-spacing="2">
      AL AHLY
    </text>

    <!-- TV in Red Badge -->
    <g transform="translate(0, 4)">
      <rect x="-45" y="0" width="90" height="24" rx="12" fill="url(#shieldGrad)" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.6"/>
      <text x="0" y="17" fill="#ffffff" font-family="'Cairo', 'Inter', sans-serif" font-weight="900" font-size="13" letter-spacing="2">
        قناة الأهلي
      </text>
    </g>

    <!-- Subtitle: Club of the Century -->
    <g transform="translate(0, 38)">
      <rect x="-65" y="0" width="130" height="18" rx="9" fill="#000000" fill-opacity="0.6" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="13" fill="#fde047" font-family="'Cairo', sans-serif" font-weight="800" font-size="10" letter-spacing="0.5">
        نادي القرن الإفريقي 1907
      </text>
    </g>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(20, 358)">
    <text x="0" y="14" fill="#ffffff" font-family="'Cairo', sans-serif" font-weight="800" font-size="16">القلعة الحمراء</text>
    <text x="0" y="32" fill="#fca5a5" font-family="'Cairo', sans-serif" font-weight="600" font-size="12">مباريات وتدريبات الأهلي الحصرية</text>
  </g>

  <!-- Subtle Border Rim -->
  <rect width="298" height="418" x="1" y="1" rx="19" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15"/>
</svg>
