<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="ontimeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1c"/>
      <stop offset="40%" stop-color="#111c34"/>
      <stop offset="75%" stop-color="#1e0c14"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="ontimeGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="300" height="420" rx="20" fill="url(#ontimeBg)"/>
  <rect width="300" height="420" rx="20" fill="url(#ontimeGlow)"/>

  <!-- Dynamic Stadium Light Beams & Field Lines -->
  <path d="M -30 200 L 330 60" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.3"/>
  <path d="M -30 220 L 330 80" stroke="#ef4444" stroke-width="2" stroke-opacity="0.25"/>
  <circle cx="150" cy="195" r="125" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12" stroke-dasharray="8 6"/>
  <circle cx="150" cy="195" r="85" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.18"/>

  <!-- Top Badges -->
  <g transform="translate(18, 22)">
    <rect width="68" height="24" rx="12" fill="#ef4444" filter="url(#shadow)"/>
    <circle cx="14" cy="12" r="4" fill="#ffffff"/>
    <text x="36" y="16" fill="#ffffff" font-family="'Cairo', 'Inter', sans-serif" font-weight="900" font-size="11" letter-spacing="1">LIVE</text>
  </g>

  <g transform="translate(216, 22)">
    <rect width="66" height="24" rx="6" fill="#000000" fill-opacity="0.65" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1"/>
    <text x="33" y="16" fill="#f87171" font-family="'Inter', sans-serif" font-weight="900" font-size="11" text-anchor="middle">FHD 1080</text>
  </g>

  <!-- Center ON Time Sports Branding -->
  <g transform="translate(150, 195)" filter="url(#shadow)" text-anchor="middle">
    <!-- Glowing background plate -->
    <rect x="-115" y="-68" width="230" height="136" rx="20" fill="#070c17" fill-opacity="0.85" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Egyptian Flag Accent Bar -->
    <g transform="translate(-40, -56)">
      <rect x="0" y="0" width="26" height="4" rx="1" fill="#ef4444"/>
      <rect x="27" y="0" width="26" height="4" rx="1" fill="#ffffff"/>
      <rect x="54" y="0" width="26" height="4" rx="1" fill="#1e293b"/>
    </g>
    
    <!-- ON TIME Typography -->
    <text x="0" y="-12" fill="#ffffff" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="34" letter-spacing="2">
      ON <tspan fill="#38bdf8">TIME</tspan>
    </text>
    
    <!-- SPORTS Red Banner -->
    <g transform="translate(0, 4)">
      <rect x="-70" y="0" width="140" height="22" rx="4" fill="url(#redGrad)"/>
      <text x="0" y="16" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="14" letter-spacing="6">
        SPORTS
      </text>
    </g>

    <!-- Channel Badge: 1 HD -->
    <g transform="translate(0, 36)">
      <rect x="-42" y="0" width="84" height="20" rx="10" fill="url(#blueGrad)"/>
      <text x="0" y="14" fill="#ffffff" font-family="'Cairo', 'Inter', sans-serif" font-weight="900" font-size="11" letter-spacing="1">
        1 HD مصر
      </text>
    </g>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(20, 358)">
    <text x="0" y="14" fill="#ffffff" font-family="'Cairo', sans-serif" font-weight="800" font-size="16">الدوري المصري الممتاز</text>
    <text x="0" y="32" fill="#93c5fd" font-family="'Cairo', sans-serif" font-weight="600" font-size="12">كأس مصر ومباريات الفراعنة</text>
  </g>

  <!-- Subtle Border Rim -->
  <rect width="298" height="418" x="1" y="1" rx="19" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15"/>
</svg>
