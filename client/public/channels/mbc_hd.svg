<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="mbcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="50%" stop-color="#0d2448"/>
      <stop offset="100%" stop-color="#050c18"/>
    </linearGradient>
    <radialGradient id="mbcGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="300" height="420" rx="20" fill="url(#mbcBg)"/>
  <rect width="300" height="420" rx="20" fill="url(#mbcGlow)"/>

  <!-- Fluid Ribbon Swoosh (Aesthetic MBC waves) -->
  <path d="M 0 100 Q 150 250 300 130" fill="none" stroke="url(#skyGrad)" stroke-width="3" stroke-opacity="0.35"/>
  <path d="M 0 320 Q 150 180 300 290" fill="none" stroke="url(#goldAcc)" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Top Badges -->
  <g transform="translate(18, 22)">
    <rect width="68" height="24" rx="12" fill="#ef4444" filter="url(#shadow)"/>
    <circle cx="14" cy="12" r="4" fill="#ffffff"/>
    <text x="36" y="16" fill="#ffffff" font-family="'Cairo', 'Inter', sans-serif" font-weight="900" font-size="11" letter-spacing="1">LIVE</text>
  </g>

  <g transform="translate(222, 22)">
    <rect width="60" height="24" rx="6" fill="#000000" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="30" y="16" fill="#7dd3fc" font-family="'Inter', sans-serif" font-weight="800" font-size="11" text-anchor="middle">FHD</text>
  </g>

  <!-- Center MBC Branding -->
  <g transform="translate(150, 195)" filter="url(#shadow)" text-anchor="middle">
    <!-- Glowing background plate -->
    <rect x="-105" y="-60" width="210" height="120" rx="18" fill="#061325" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
    
    <!-- MBC Curves Representation / Ribbon Emblem -->
    <path d="M -50 -15 C -40 -35 -20 -35 -15 -15 C -10 -35 10 -35 15 -15 C 20 -35 40 -35 50 -15" fill="none" stroke="url(#goldAcc)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- MBC Typography -->
    <text x="0" y="18" fill="#ffffff" font-family="'Arial Black', 'Inter', sans-serif" font-weight="900" font-size="42" letter-spacing="3">
      mbc<tspan fill="#38bdf8">1</tspan>
    </text>

    <!-- Channel Badge HD -->
    <g transform="translate(0, 36)">
      <rect x="-35" y="0" width="70" height="20" rx="10" fill="url(#skyGrad)"/>
      <text x="0" y="14" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="11" letter-spacing="2">
        HD
      </text>
    </g>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(20, 360)">
    <text x="0" y="14" fill="#ffffff" font-family="'Cairo', sans-serif" font-weight="800" font-size="16">مسلسلات وبرامج عربية</text>
    <text x="0" y="32" fill="#93c5fd" font-family="'Cairo', sans-serif" font-weight="600" font-size="12">ترفيه عائلي منوع</text>
  </g>

  <!-- Subtle Border Rim -->
  <rect width="298" height="418" x="1" y="1" rx="19" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15"/>
</svg>
