<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="dmcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a28"/>
      <stop offset="45%" stop-color="#05334e"/>
      <stop offset="85%" stop-color="#021420"/>
      <stop offset="100%" stop-color="#01090f"/>
    </linearGradient>
    <radialGradient id="dmcGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="dramaRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="300" height="420" rx="20" fill="url(#dmcBg)"/>
  <rect width="300" height="420" rx="20" fill="url(#dmcGlow)"/>

  <!-- Modern Geometric Circles -->
  <circle cx="230" cy="110" r="85" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.2"/>
  <circle cx="70" cy="300" r="95" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.15" stroke-dasharray="6 6"/>

  <!-- Top Badges -->
  <g transform="translate(18, 22)">
    <rect width="68" height="24" rx="12" fill="#ef4444" filter="url(#shadow)"/>
    <circle cx="14" cy="12" r="4" fill="#ffffff"/>
    <text x="36" y="16" fill="#ffffff" font-family="'Cairo', 'Inter', sans-serif" font-weight="900" font-size="11" letter-spacing="1">LIVE</text>
  </g>

  <g transform="translate(216, 22)">
    <rect width="66" height="24" rx="6" fill="#000000" fill-opacity="0.65" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="1"/>
    <text x="33" y="16" fill="#22d3ee" font-family="'Inter', sans-serif" font-weight="900" font-size="11" text-anchor="middle">FHD 1080</text>
  </g>

  <!-- Center dmc Branding -->
  <g transform="translate(150, 205)" filter="url(#shadow)" text-anchor="middle">
    <!-- Glowing background plate -->
    <rect x="-115" y="-76" width="230" height="152" rx="20" fill="#021422" fill-opacity="0.9" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- dmc Modern Iconic Typography -->
    <text x="0" y="-4" fill="#ffffff" font-family="'Inter', 'Arial', sans-serif" font-weight="900" font-size="46" letter-spacing="-1">
      dm<tspan fill="#22d3ee">c</tspan>
    </text>

    <!-- DRAMA Badge -->
    <g transform="translate(0, 10)">
      <rect x="-50" y="0" width="100" height="24" rx="12" fill="url(#dramaRed)"/>
      <text x="0" y="17" fill="#ffffff" font-family="'Cairo', 'Inter', sans-serif" font-weight="900" font-size="13" letter-spacing="2">
        دراما HD
      </text>
    </g>

    <!-- Subtitle: Egyptian Family Screen -->
    <g transform="translate(0, 44)">
      <rect x="-65" y="0" width="130" height="18" rx="9" fill="#000000" fill-opacity="0.6" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="13" fill="#67e8f9" font-family="'Cairo', sans-serif" font-weight="800" font-size="10" letter-spacing="0.5">
        شاشة العائلة المصرية
      </text>
    </g>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(20, 358)">
    <text x="0" y="14" fill="#ffffff" font-family="'Cairo', sans-serif" font-weight="800" font-size="16">دراما وسينما حصرية</text>
    <text x="0" y="32" fill="#a5f3fc" font-family="'Cairo', sans-serif" font-weight="600" font-size="12">أضخم الإنتاجات الدرامية والبرامجية</text>
  </g>

  <!-- Subtle Border Rim -->
  <rect width="298" height="418" x="1" y="1" rx="19" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15"/>
</svg>
