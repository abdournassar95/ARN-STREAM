<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="osnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24050a"/>
      <stop offset="50%" stop-color="#450a12"/>
      <stop offset="100%" stop-color="#150205"/>
    </linearGradient>
    <radialGradient id="osnGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="300" height="420" rx="20" fill="url(#osnBg)"/>
  <rect width="300" height="420" rx="20" fill="url(#osnGlow)"/>

  <!-- Cinema Reel / Light Rays -->
  <circle cx="150" cy="195" r="115" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 6"/>
  <path d="M 50 50 L 250 350" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.15"/>
  <path d="M 250 50 L 50 350" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Top Badges -->
  <g transform="translate(18, 22)">
    <rect width="68" height="24" rx="12" fill="#ef4444" filter="url(#shadow)"/>
    <circle cx="14" cy="12" r="4" fill="#ffffff"/>
    <text x="36" y="16" fill="#ffffff" font-family="'Cairo', 'Inter', sans-serif" font-weight="900" font-size="11" letter-spacing="1">LIVE</text>
  </g>

  <g transform="translate(222, 22)">
    <rect width="60" height="24" rx="6" fill="#000000" fill-opacity="0.6" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1"/>
    <text x="30" y="16" fill="#fda4af" font-family="'Inter', sans-serif" font-weight="800" font-size="11" text-anchor="middle">FHD</text>
  </g>

  <!-- Center OSN Branding -->
  <g transform="translate(150, 195)" filter="url(#shadow)" text-anchor="middle">
    <!-- Glowing background plate -->
    <rect x="-105" y="-60" width="210" height="120" rx="18" fill="#1c0407" fill-opacity="0.85" stroke="#f43f5e" stroke-opacity="0.35" stroke-width="1.5"/>
    
    <!-- OSN Typography -->
    <text x="0" y="-5" fill="#ffffff" font-family="'Arial Black', 'Inter', sans-serif" font-weight="900" font-size="46" letter-spacing="3">
      osn<tspan fill="#f43f5e">tv</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="20" fill="#fecdd3" font-family="'Inter', sans-serif" font-weight="800" font-size="14" letter-spacing="4">
      MOVIES
    </text>

    <!-- Channel Badge -->
    <g transform="translate(0, 36)">
      <rect x="-44" y="0" width="88" height="20" rx="10" fill="url(#roseGrad)"/>
      <text x="0" y="14" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="10" letter-spacing="1">
        PREMIERE
      </text>
    </g>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(20, 360)">
    <text x="0" y="14" fill="#ffffff" font-family="'Cairo', sans-serif" font-weight="800" font-size="16">أحدث أفلام هوليوود</text>
    <text x="0" y="32" fill="#fecdd3" font-family="'Cairo', sans-serif" font-weight="600" font-size="12">سينما ومسلسلات حصرية</text>
  </g>

  <!-- Subtle Border Rim -->
  <rect width="298" height="418" x="1" y="1" rx="19" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15"/>
</svg>
